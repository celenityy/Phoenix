/// Allow storing cookies persistently
// (We only allow Discord to save cookies, via `permissions.manager.defaultsUrl`)
defaultPref("network.cookie.noPersistentStorage", false); // [DEFAULT]

/// By default, allow Discord to:
// - Prompt to access camera
// - Prompt to access microphone
// - Prompt to screenshare
// - Prompt to send notifications
// - Save cookies/site data
defaultPref("permissions.manager.defaultsUrl", "file:///etc/firefox/phoenix/resources/specs/discord/permissions"); // [LINUX-NON-FLATPAK-ONLY]
defaultPref("permissions.manager.defaultsUrl", "file:///app/etc/firefox/phoenix/resources/specs/discord/permissions"); // [FLATPAK-LINUX-ONLY]
defaultPref("permissions.manager.defaultsUrl", "file:///opt/homebrew/opt/phoenix-osx/resources/specs/discord/permissions"); // [SILICON-OSX-ONLY]
defaultPref("permissions.manager.defaultsUrl", "file:///usr/local/opt/phoenix-intel/resources/specs/discord/permissions"); // [INTEL-OSX-ONLY]
defaultPref("permissions.manager.defaultsUrl", "file:///C:/phoenix/resources/specs/discord/permissions"); // [WINDOWS-ONLY]

/// Disable timezone spoofing
defaultPref("privacy.fingerprintingProtection.granularOverrides", '[{"firstPartyDomain":"discord.com","overrides":"-JSDateTimeUTC"}]');

/// Re-enable clipboard events
// Required for copying links
defaultPref("dom.event.clipboardevents.enabled", true); // [DEFAULT]

/// Re-enable file picker dialogs
defaultPref("widget.disable_file_pickers", false);

/// Re-enable origin headers, but only for requests that are same-origin
// Required for file uploads
defaultPref("network.http.sendOriginHeader", 1);

/// Re-enable Picture-in-Picture
defaultPref("media.videocontrols.picture-in-picture.audio-toggle.enabled", true); // [DEFAULT]
defaultPref("media.videocontrols.picture-in-picture.enabled", true); // [DEFAULT]
defaultPref("media.videocontrols.picture-in-picture.urlbar-button.enabled", true); // [DEFAULT]
defaultPref("media.videocontrols.picture-in-picture.video-toggle.enabled", true); // [DEFAULT]

/// (Re-)enable screensharing
defaultPref("media.getusermedia.browser.enabled", true); // [DEFAULT - Nightly]
defaultPref("media.getusermedia.screensharing.enabled", true);

/// Re-enable SVG
defaultPref("svg.disabled", false);

/// Re-enable WebAuthn
defaultPref("security.webauth.webauthn_enable_usbtoken", true);
defaultPref("security.webauthn.enable_macos_passkeys", true); // [OSX-ONLY]

/// Unbreak calling
defaultPref("media.peerconnection.enabled", true); // [DEFAULT]
defaultPref("media.peerconnection.ice.default_address_only", false); // [DEFAULT]
defaultPref("media.peerconnection.ice.no_host", false); // [DEFAULT]
defaultPref("media.peerconnection.ice.relay_only", false); // [DEFAULT]

