};

// Android
// We're checking for the following variables here:
// MOZ_ANDROID_CPU_ABI
// MOZ_ANDROID_LIBDIR
// MOZ_ANDROID_PACKAGE_NAME
// MOZ_ANDROID_USER_SERIAL_NUMBER
// ANDROID_BOOTLOGO
// ANDROID_DATA
// ANDROID_ART_ROOT
// ANDROID_I18N_ROOT
// ANDROID_STORAGE
// ANDROID_TZDATA_ROOT
// ASEC_MOUNTPOINT
// (For a list of general system (ANDROID_) variables, see:
// https://android.googlesource.com/platform/system/core/+/refs/heads/main/rootdir/init.environ.rc.in)
// The MOZ_ANDROID variables are checked first/preferred because we know they're set by the browser directly,
// and are thus always available in the context of the browser - they're also highly specific
let phoenixFoundAndroidEnv1 = false;
let phoenixFoundAndroidEnv2 = false;
if (phoenixRunPlatformChecks && PHOENIX_PLATFORM == 'unknown') {
    try {
        // MOZ_ANDROID_CPU_ABI
        if (getenv("MOZ_ANDROID_CPU_ABI")) {
            phoenixFoundAndroidEnv1 = true;
        };

        // MOZ_ANDROID_LIBDIR
        if (getenv("MOZ_ANDROID_LIBDIR")) {
            if (phoenixFoundAndroidEnv1) {
                phoenixFoundAndroidEnv2 = true;
            } else {
                phoenixFoundAndroidEnv1 = true;
            };
        };

        // MOZ_ANDROID_PACKAGE_NAME
        if (!phoenixFoundAndroidEnv2) {
            if (getenv("MOZ_ANDROID_PACKAGE_NAME")) {
                if (phoenixFoundAndroidEnv1) {
                    phoenixFoundAndroidEnv2 = true;
                } else {
                    phoenixFoundAndroidEnv1 = true;
                };
            };
        };

        // MOZ_ANDROID_USER_SERIAL_NUMBER
        if (!phoenixFoundAndroidEnv2) {
            if (getenv("MOZ_ANDROID_USER_SERIAL_NUMBER")) {
                if (phoenixFoundAndroidEnv1) {
                    phoenixFoundAndroidEnv2 = true;
                } else {
                    phoenixFoundAndroidEnv1 = true;
                };
            };
        };

        // ANDROID_BOOTLOGO
        if (!phoenixFoundAndroidEnv2) {
            if (getenv("ANDROID_BOOTLOGO")) {
                if (phoenixFoundAndroidEnv1) {
                    phoenixFoundAndroidEnv2 = true;
                } else {
                    phoenixFoundAndroidEnv1 = true;
                };
            };
