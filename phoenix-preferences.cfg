// Welcome to the birth of the Phoenix.
// This file contains default values for Phoenix-specific preferences (as well as some initial defines), so that
// projects consuming Phoenix (ex. Dove, IronFox) can override their values.
// These preferences need to be ready very early, so it doesn't really work to just set them as overrides at the end.
// In practice, this file is just appended to the top of `phoenix-unified.cfg`.

// Check if a preference exists
/// We can't use getPref() for this because:
/// For boolean prefs, it returns false if the pref is set to false
/// For integer prefs, it returns false if the pref is set to 0
/// For string prefs, it returns false if the pref is set to an empty string ("")
/// So this gives us a way to check if a preference *actually* exists:
/// If the pref exists, regardless of the value, we return `true`
/// If it doesn't, regardless of the value, we return `false`
function prefExists(preference) {
    try {
        if (getPref(preference) == false || getPref(preference) == 0 || getPref(preference) == "") {
            // If the pref is set to false, 0, or an empty string, getPref() would usually return false (even if it exists)
            // We instead return true in such cases, because if a pref is set to those values, we know it indeed exists
            return true;
        } else {
            // If the pref isn't one of those values, we can just return getPref() directly
            return getPref(preference);
        };
    } catch (e) {
        return false;
    };
};

// Whether we're targeting Thunderbird
/// PHOENIX_MAIL is set by the build scripts
const phoenixMail = {PHOENIX_MAIL};

// Determine our platform
/// (See: https://codeberg.org/celenity/Phoenix/issues/231)
defaultPref("browser.phoenix.platform", "unknown"); // [FN]
defaultPref("browser.phoenix.platform.type", "unknown"); // [FN]

// If true, this preference will force the platform checks to run
/// Useful for cases like testing, or if the user ex. migrates profiles across platforms
/// (It is automatically set to `false` after the platform checks complete)
defaultPref("browser.phoenix.platform.shouldRunChecks", true); // [FN]

// If true, this preference will force the platform *type* checks to run
/// Useful for cases like testing, or if the user ex. migrates profiles across platforms
/// (It is automatically set to `false` after the platform type checks complete)
defaultPref("browser.phoenix.platform.type.shouldRunChecks", true); // [FN]

// If PHOENIX_HARDCODE_PLATFORM is set to 1 at build-time, we will hardcode the target platform, instead of trying to
/// determine it automatically (from the checks below)
/// While our checks do seem to work reliably, it's safer to hardcode/set the platform directly, especially since we still currently
/// ship other OS-specific files anyways (ex. policies)
/// (See discussion at: https://codeberg.org/celenity/Phoenix/issues/231)
/// PHOENIX_PLATFORM_TO_HARDCODE and PHOENIX_PLATFORM_TYPE_TO_HARDCODE} are set by the build scripts
const phoenixPlatformToHardcode = "{PHOENIX_PLATFORM_TO_HARDCODE}";
const phoenixPlatformTypeToHardcode = "{PHOENIX_PLATFORM_TYPE_TO_HARDCODE}";

// Set our hardcoded platform (if necessary)
if (phoenixPlatformToHardcode == 'android' || phoenixPlatformToHardcode == 'linux' || phoenixPlatformToHardcode == 'osx' ||
 phoenixPlatformToHardcode == 'windows') {
    lockPref("browser.phoenix.platform", phoenixPlatformToHardcode); // [FN]
    lockPref("browser.phoenix.platform.shouldRunChecks", false); // [FN]

    // Set our hardcoded platform *type*
    /// (For now, this is only used on OS X to distinguish between Apple Silicon and Intel)
    if (phoenixPlatformToHardcode == 'osx' && (phoenixPlatformTypeToHardcode == 'intel' || phoenixPlatformTypeToHardcode == "silicon")) {
        lockPref("browser.phoenix.platform.type", phoenixPlatformTypeToHardcode); // [FN]
    } else {
        lockPref("browser.phoenix.platform.type", "generic"); // [FN]
    };
    lockPref("browser.phoenix.platform.type.shouldRunChecks", false); // [FN]
};

const phoenixShouldRunPlatformChecks = getPref("browser.phoenix.platform.shouldRunChecks");
const phoenixPlatformCurrentValue = getPref("browser.phoenix.platform");

// The platform checks below will run if:
/// 1. `browser.phoenix.platform` is not set to a supported/recognized value
/// OR:
/// 2. `browser.phoenix.platform.shouldRunChecks` is set to `true`
let phoenixRunPlatformChecks = false;
if (phoenixShouldRunPlatformChecks || (phoenixPlatformCurrentValue != 'android' && phoenixPlatformCurrentValue != 'linux' &&
 phoenixPlatformCurrentValue != 'osx' && phoenixPlatformCurrentValue != 'windows')) {
    phoenixRunPlatformChecks = true;
};

let PHOENIX_PLATFORM = 'unknown';

// Round 1
if (phoenixRunPlatformChecks) {
    try {
        // First, check the value of PHOENIX_HOST_PLATFORM
        // This always takes priority over everything else
        if (getenv("PHOENIX_HOST_PLATFORM") == 'osx-intel') {
            // (We distinguish between OS X and OS X Intel later)
            PHOENIX_PLATFORM = 'osx';
        } else if (getenv("PHOENIX_HOST_PLATFORM") == 'android' || getenv("PHOENIX_HOST_PLATFORM") == 'linux' ||
         getenv("PHOENIX_HOST_PLATFORM") == 'osx' || getenv("PHOENIX_HOST_PLATFORM") == 'windows') {
            PHOENIX_PLATFORM = getenv("PHOENIX_HOST_PLATFORM");

        // If we're still not sure, we can try Dove's environment variables
        } else if (getenv("DOVE_HOST_PLATFORM") == 'osx-intel') {
            PHOENIX_PLATFORM = 'osx';
        } else if (getenv("DOVE_HOST_PLATFORM") == 'linux' || getenv("DOVE_HOST_PLATFORM") == 'osx' ||
         getenv("DOVE_HOST_PLATFORM") == 'windows') {
            PHOENIX_PLATFORM = getenv("DOVE_HOST_PLATFORM");

        // If we're not sure at this point: Windows explicitly sets an "OS" environment variable, so try that...
        } else if (getenv("OS") == "Windows_NT") {
            PHOENIX_PLATFORM = 'windows';

        // If we're still not sure, we can look for Firefox's GTK (XDG Home) preference:
        // widget.support-xdg-config
        // This isn't ideal because it's only set on Firefox for Desktop, but it is a clear/direct platform indicator, so let's use it if we can
        // Also locked at build-time, which is great
        // https://searchfox.org/firefox-main/rev/e28b34ab/browser/app/profile/firefox.js#3603
        } else if (getPref("widget.support-xdg-config") == true) {
            PHOENIX_PLATFORM = 'linux';

        // Okay, if we're *still* not sure, it's a long shot - but we can try Thunderbird's preferences:
        // mail.inappnotifications.isFlatpak
        // mail.inappnotifications.isSnap
        // These are set upon each launch as `user` prefs:
        // https://searchfox.org/comm-central/rev/d5dc7a53/mail/components/MailGlue.sys.mjs#600
        } else if (getPref("mail.inappnotifications.isFlatpak") == true || getPref("mail.inappnotifications.isSnap") == true) {
            PHOENIX_PLATFORM = 'linux';
        };
    } catch (e) {};
};

// Round 2
if (phoenixRunPlatformChecks && PHOENIX_PLATFORM == 'unknown') {
    // So, if we don't have an environment variable we can use that sets the OS directly, and we can't use Thunderbird's preferences,
    // the next best thing is distribution/partner preferences
    // For reference, these are preferences set by Firefox distributors (such as Mozilla and Linux package maintainers) to indicate their
    // origin/add attribution: https://firefox-source-docs.mozilla.org/taskcluster/partner-repacks.html
    // These are clear, direct indicators of a platform, so worth using directly as a fall-back

    // The values we're checking here cover...

    // Arch Linux:
    /// https://gitlab.archlinux.org/archlinux/packaging/packages/firefox/-/blob/95a1152b7bba4db2ecffda17b11e73832da88380/PKGBUILD#L242
    /// Thunderbird: https://gitlab.archlinux.org/archlinux/packaging/packages/thunderbird/-/blob/main/distribution.ini

    // Canonical (Ubuntu):
    /// https://github.com/mozilla-partners/canonical/blob/master/desktop/ubuntu/distribution/distribution.ini
    /// https://git.launchpad.net/~mozillateam/firefox/tree/debian/distribution.ini
    /// Thunderbird: https://searchfox.org/comm-central/source/taskcluster/docker/tb-snap/distribution.ini

    // Fedora:
    /// https://src.fedoraproject.org/rpms/firefox/blob/main/f/distribution.ini.in
    /// https://src.fedoraproject.org/rpms/firefox/blob/e9eb90d451aedeed3236cb012cb34227fef52b1b/f/firefox.spec#_1148
    /// Thunderbird: https://src.fedoraproject.org/rpms/thunderbird/blob/rawhide/f/thunderbird-redhat-default-prefs.js

    // Gentoo: https://codeberg.org/gentoo/gentoo/src/branch/master/www-client/firefox/files/distribution.ini
    /// Thunderbird: https://codeberg.org/gentoo/gentoo/src/branch/master/mail-client/thunderbird/files/distribution.ini

    // Linux Mint: https://github.com/mozilla-partners/mint/blob/main/desktop/mint/distribution/distribution.ini
    // OpenSUSE: https://build.opensuse.org/projects/openSUSE:Factory/packages/MozillaFirefox-branding-openSUSE/files/distribution.ini.in

    // Debian (Generic) - Firefox:
    /// https://searchfox.org/firefox-main/source/browser/installer/linux/app/debian/distribution.ini
    /// https://github.com/mozilla-partners/deb/blob/main/desktop/deb/distribution/distribution.ini
    // Debian (Generic) - Thunderbird: https://searchfox.org/comm-central/source/mail/installer/linux/app/debian/distribution.ini

    // RPM (Generic):
    /// https://searchfox.org/firefox-main/source/browser/installer/linux/app/rpm/distribution.ini
    /// https://github.com/mozilla-partners/rpm/blob/main/desktop/rpm/distribution/distribution.ini

    // Flatpak (Generic) - Firefox: https://github.com/mozilla-partners/flatpak/blob/master/desktop/flatpak/distribution/distribution.ini
    // Flatpak (Generic) - Thunderbird: https://searchfox.org/comm-central/source/taskcluster/docker/tb-flatpak/distribution.ini

    // Snap (Generic) - Thunderbird: https://searchfox.org/comm-central/source/taskcluster/docker/tb-snap/distribution.ini

    // Windows (MSIX) - Firefox: https://searchfox.org/firefox-main/source/browser/installer/windows/msix/distribution/distribution.ini
    // Windows (MSIX) - Thunderbird: https://searchfox.org/comm-central/source/mail/installer/windows/msix/distribution/distribution.ini
    
    // First, we're going to start with `distribution.id`, because that appears to be the most universal/widely used
    // (We clear it to ensure we're only using the default value. This pref doesn't work if set as a user pref anyways)
    clearPref("distribution.id");

    // distribution.id
    try {
        if (prefExists("distribution.id")) {
            // Windows
            if (getPref("distribution.id") == "mozilla-MSIX" || getPref("distribution.id") == "thunderbird-MSIX") {
                PHOENIX_PLATFORM = 'windows';
            // Linux
            } else if (getPref("distribution.id") == "archlinux" || getPref("distribution.id") == "canonical" ||
             getPref("distribution.id") == "canonical-002" || getPref("distribution.id") == "fedora" ||
             getPref("distribution.id") == "gentoo" || getPref("distribution.id") == "mint-001" ||
             getPref("distribution.id") == "mozilla-deb" || getPref("distribution.id") == "mozilla-flatpak" ||
             getPref("distribution.id") == "mozilla-rpm" || getPref("distribution.id") == "openSUSE" ||
             getPref("distribution.id") == "thunderbird-deb" || getPref("distribution.id") == "thunderbird-flatpak" ||
             getPref("distribution.id") == "thunderbird-snap") {
                PHOENIX_PLATFORM = 'linux';
             };
        };
    } catch (e) {};

    if (PHOENIX_PLATFORM == 'unknown') {
        // If we still don't have a platform, check the following additional distribution/partner preferences:
        // app.distributor
        // app.distributor.channel
        // app.partner.archlinux
        // app.partner.fedora
        // app.partner.mint
        // app.partner.opensuse
        // app.partner.ubuntu
        // general.useragent.vendor
        // mozilla.partner.id
        try {
            // Like we did with `distribution.id`, clear these prefs to ensure we use the defaults
            clearPref("app.distributor");
            clearPref("app.distributor.channel");
            clearPref("app.partner.archlinux");
            clearPref("app.partner.fedora");
            clearPref("app.partner.mint");
            clearPref("app.partner.opensuse");
            clearPref("app.partner.ubuntu");
            clearPref("distribution.id");
            clearPref("general.useragent.vendor");
            clearPref("mozilla.partner.id");

            if (getPref("app.distributor") == "archlinux" || getPref("app.distributor") == "canonical" || getPref("app.distributor") == "fedora" ||
             getPref("app.distributor") == "gentoo" || getPref("app.distributor") == "mint" || getPref("app.distributor.channel") == "fedora" ||
             getPref("app.distributor.channel") == "gentoo" || getPref("app.distributor.channel") == "ubuntu" ||
             getPref("app.partner.archlinux") == "archlinux" || getPref("app.partner.fedora") == "fedora" || getPref("app.partner.mint") == "mint" ||
             getPref("app.partner.opensuse") == "opensuse" || getPref("app.partner.ubuntu") == "ubuntu" ||
             getPref("general.useragent.vendor") == "Fedora" || getPref("mozilla.partner.id") == "mint" || getPref("mozilla.partner.id") == "ubuntu") {
                PHOENIX_PLATFORM = 'linux';
            };
        } catch (e) {};
    };
};

// Round 3
// If we *still* don't have our platform, then, to set the platform at this point, we must find EITHER:
// - *Two* environment variables OR
// - *Two* preferences OR
// - *One* environment variable AND *one* preference

// We'll start with environment variables

// Begin with Linux
// (Because Linux has the largest selection of variables for us to choose from...)
// We're checking for the following variables here:
// SYSTEMD_EXEC_PID
// WAYLAND_DISPLAY
// WAYLAND_PROXY_LOG
// XDG_ACTIVATION_TOKEN
// XDG_CURRENT_DESKTOP
// XDG_SESSION_DESKTOP
// FLATPAK_ID
// GDK_BACKEND
// GDMSESSION
// GNOME_DESKTOP_SESSION_ID
// GTK_USE_PORTAL
// KDE_FULL_SESSION
// LXQT_SESSION_CONFIG
// MATE_DESKTOP_SESSION_ID
// MOZ_DISABLE_WAYLAND_PROXY
// MOZ_GDK_DISPLAY
// MOZ_USE_XINPUT2
// MOZ_X_SYNC
// MOZ_X11_EGL
// SNAP
// SNAP_DESKTOP_RUNTIME
// SNAP_INSTANCE_NAME
// SNAP_NAME
// SNAP_REAL_HOME
// NOTE: We can't use all of the XDG_ variables, because the standard ones seem to be gaining adoption on other platforms like OS X - ex:
// https://www.followtheprocess.codes/posts/macos-env-vars/ + https://aliquote.org/post/xdg-specs-on-macos/
// But we can use some of the ones that are only relevant to Linux (ex. ones related to DEs/Wayland/etc.)
// (We're also checking the SYSTEMD_, WAYLAND_, and XDG_ variables first, because they're the most universal IMO)
let phoenixFoundLinuxEnv1 = false;
let phoenixFoundLinuxEnv2 = false;

if (phoenixRunPlatformChecks && PHOENIX_PLATFORM == 'unknown') {
    try {
        // SYSTEMD_EXEC_PID
        if (getenv("SYSTEMD_EXEC_PID")) {
            phoenixFoundLinuxEnv1 = true;
        };

        // WAYLAND_DISPLAY
        if (getenv("WAYLAND_DISPLAY")) {
            if (phoenixFoundLinuxEnv1) {
                phoenixFoundLinuxEnv2 = true;
            } else {
                phoenixFoundLinuxEnv1 = true;
            };
        };

        // WAYLAND_PROXY_LOG
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("WAYLAND_PROXY_LOG")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // XDG_ACTIVATION_TOKEN
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("XDG_ACTIVATION_TOKEN")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // XDG_CURRENT_DESKTOP
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("XDG_CURRENT_DESKTOP")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // XDG_SESSION_DESKTOP
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("XDG_SESSION_DESKTOP")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // FLATPAK_ID
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("FLATPAK_ID")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // GDK_BACKEND
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("GDK_BACKEND")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // GDMSESSION
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("GDMSESSION")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // GNOME_DESKTOP_SESSION_ID
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("GNOME_DESKTOP_SESSION_ID")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // GTK_USE_PORTAL
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("GTK_USE_PORTAL")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // KDE_FULL_SESSION
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("KDE_FULL_SESSION")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // LXQT_SESSION_CONFIG
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("LXQT_SESSION_CONFIG")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // MATE_DESKTOP_SESSION_ID
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("MATE_DESKTOP_SESSION_ID")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // MOZ_DISABLE_WAYLAND_PROXY
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("MOZ_DISABLE_WAYLAND_PROXY")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // MOZ_GDK_DISPLAY
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("MOZ_GDK_DISPLAY")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // MOZ_USE_XINPUT2
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("MOZ_USE_XINPUT2")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // MOZ_X_SYNC
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("MOZ_X_SYNC")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // MOZ_X11_EGL
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("MOZ_X11_EGL")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // SNAP
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("SNAP")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // SNAP_DESKTOP_RUNTIME
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("SNAP_DESKTOP_RUNTIME")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
            };
        };

        // SNAP_INSTANCE_NAME
        if (!phoenixFoundLinuxEnv2) {
            if (getenv("SNAP_INSTANCE_NAME")) {
                if (phoenixFoundLinuxEnv1) {
                    phoenixFoundLinuxEnv2 = true;
                } else {
                    phoenixFoundLinuxEnv1 = true;
                };
