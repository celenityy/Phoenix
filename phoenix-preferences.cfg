// Welcome to the birth of the Phoenix.
// This file contains default values for Phoenix-specific preferences (as well as some initial defines), so that
// projects consuming Phoenix (ex. Dove, IronFox) can override their values.
// These preferences need to be ready very early, so it doesn't really work to just set them as overrides at the end.
// In practice, this file is just appended to the top of `phoenix-unified.cfg`.

// Check if a preference exists
/// We can't use getPref() for this because:
/// For boolean prefs, it returns false if the pref is set to false
/// For integer prefs, it returns false if the pref is set to 0
/// For string prefs, it returns false if the pref is set to an empty string ("")
/// So this gives us a way to check if a preference *actually* exists:
/// If the pref exists, regardless of the value, we return `true`
/// If it doesn't, regardless of the value, we return `false`
function prefExists(preference) {
    try {
        if (getPref(preference) == false || getPref(preference) == 0 || getPref(preference) == "") {
            // If the pref is set to false, 0, or an empty string, getPref() would usually return false (even if it exists)
            // We instead return true in such cases, because if a pref is set to those values, we know it indeed exists
            return true;
        } else {
            // If the pref isn't one of those values, we can just return getPref() directly
            return getPref(preference);
        };
    } catch (e) {
        return false;
    };
};

// Whether we're targeting Thunderbird
/// PHOENIX_MAIL is set by the build scripts
const phoenixMail = {PHOENIX_MAIL};

// Determine our platform
/// (See: https://codeberg.org/celenity/Phoenix/issues/231)
defaultPref("browser.phoenix.platform", "unknown"); // [FN]
defaultPref("browser.phoenix.platform.type", "unknown"); // [FN]

// If true, this preference will force the platform checks to run
/// Useful for cases like testing, or if the user ex. migrates profiles across platforms
/// (It is automatically set to `false` after the platform checks complete)
defaultPref("browser.phoenix.platform.shouldRunChecks", true); // [FN]

// If true, this preference will force the platform *type* checks to run
/// Useful for cases like testing, or if the user ex. migrates profiles across platforms
/// (It is automatically set to `false` after the platform type checks complete)
defaultPref("browser.phoenix.platform.type.shouldRunChecks", true); // [FN]

// If PHOENIX_HARDCODE_PLATFORM is set to 1 at build-time, we will hardcode the target platform, instead of trying to
/// determine it automatically (from the checks below)
/// While our checks do seem to work reliably, it's safer to hardcode/set the platform directly, especially since we still currently
/// ship other OS-specific files anyways (ex. policies)
/// (See discussion at: https://codeberg.org/celenity/Phoenix/issues/231)
/// PHOENIX_PLATFORM_TO_HARDCODE and PHOENIX_PLATFORM_TYPE_TO_HARDCODE} are set by the build scripts
const phoenixPlatformToHardcode = "{PHOENIX_PLATFORM_TO_HARDCODE}";
const phoenixPlatformTypeToHardcode = "{PHOENIX_PLATFORM_TYPE_TO_HARDCODE}";

// Set our hardcoded platform (if necessary)
if (phoenixPlatformToHardcode == 'android' || phoenixPlatformToHardcode == 'linux' || phoenixPlatformToHardcode == 'osx' ||
 phoenixPlatformToHardcode == 'windows') {
    lockPref("browser.phoenix.platform", phoenixPlatformToHardcode); // [FN]
    lockPref("browser.phoenix.platform.shouldRunChecks", false); // [FN]

    // Set our hardcoded platform *type*
    /// (For now, this is only used on OS X to distinguish between Apple Silicon and Intel)
    if (phoenixPlatformToHardcode == 'osx' && (phoenixPlatformTypeToHardcode == 'intel' || phoenixPlatformTypeToHardcode == "silicon")) {
        lockPref("browser.phoenix.platform.type", phoenixPlatformTypeToHardcode); // [FN]
    } else {
        lockPref("browser.phoenix.platform.type", "generic"); // [FN]
    };
    lockPref("browser.phoenix.platform.type.shouldRunChecks", false); // [FN]
};

const phoenixShouldRunPlatformChecks = getPref("browser.phoenix.platform.shouldRunChecks");
const phoenixPlatformCurrentValue = getPref("browser.phoenix.platform");

// The platform checks below will run if:
/// 1. `browser.phoenix.platform` is not set to a supported/recognized value
/// OR:
/// 2. `browser.phoenix.platform.shouldRunChecks` is set to `true`
let phoenixRunPlatformChecks = false;
if (phoenixShouldRunPlatformChecks || (phoenixPlatformCurrentValue != 'android' && phoenixPlatformCurrentValue != 'linux' &&
 phoenixPlatformCurrentValue != 'osx' && phoenixPlatformCurrentValue != 'windows')) {
    phoenixRunPlatformChecks = true;
};

if (phoenixRunPlatformChecks) {
    let PHOENIX_PLATFORM = 'unknown';
    try {
        // First, check the value of PHOENIX_HOST_PLATFORM
        if (getenv("PHOENIX_HOST_PLATFORM") == "android") {
            PHOENIX_PLATFORM = 'android';
        } else if (getenv("PHOENIX_HOST_PLATFORM") == "linux") {
            PHOENIX_PLATFORM = 'linux';
        // We distinguish between OS X and OS X Intel later
        } else if (getenv("PHOENIX_HOST_PLATFORM") == "osx" || getenv("PHOENIX_HOST_PLATFORM") == "osx-intel") {
            PHOENIX_PLATFORM = 'osx';
        } else if (getenv("PHOENIX_HOST_PLATFORM") == "windows") {
            PHOENIX_PLATFORM = 'windows';

        // Now, fall-back to system env variables...

        // If any of the following env variables are defined, we know we're on Android:
        // (For general ANDROID_ vars, see ex.: https://android.googlesource.com/platform/system/core/+/refs/heads/main/rootdir/init.environ.rc.in)
        // ANDROID_ART_ROOT
        // ANDROID_BOOTLOGO
        // ANDROID_DATA
        // ANDROID_I18N_ROOT
        // ANDROID_STORAGE
        // ANDROID_TZDATA_ROOT
        // MOZ_ANDROID_CPU_ABI
        // MOZ_ANDROID_LIBDIR
        // MOZ_ANDROID_PACKAGE_NAME
        // MOZ_ANDROID_USER_SERIAL_NUMBER
        } else if (getenv("ANDROID_ART_ROOT") || getenv("ANDROID_BOOTLOGO") || getenv("ANDROID_DATA") || getenv("ANDROID_I18N_ROOT") ||
         getenv("ANDROID_STORAGE") || getenv("ANDROID_TZDATA_ROOT") || getenv("MOZ_ANDROID_CPU_ABI") || getenv("MOZ_ANDROID_LIBDIR") ||
         getenv("MOZ_ANDROID_PACKAGE_NAME") || getenv("MOZ_ANDROID_USER_SERIAL_NUMBER")) {
            PHOENIX_PLATFORM = 'android';
        // If any of the following env variables are defined, we know we're on OS X:
        // __CFBundleIdentifier
        // XPC_FLAGS
        // XPC_SERVICE_NAME
        } else if (getenv("__CFBundleIdentifier") || getenv("XPC_FLAGS") || getenv("XPC_SERVICE_NAME")) {
            PHOENIX_PLATFORM = 'osx';
        // If any of the following env variables are defined, we know we're on Windows:
        // MOZ_ENABLE_WIN32K
        // OS (set to "Windows_NT")
        // XRE_NO_DLL_READAHEAD
        // XRE_NO_WINDOWS_CRASH_DIALOG
        // windir
        } else if (getenv("OS") == "Windows_NT" || getenv("MOZ_ENABLE_WIN32K") || getenv("XRE_NO_DLL_READAHEAD") ||
         getenv("XRE_NO_WINDOWS_CRASH_DIALOG") || getenv("windir")) {
            PHOENIX_PLATFORM = 'windows';
        // If any of the following env variables are defined, we know we're on Linux:
        // FLATPAK_ID
        // GDK_BACKEND
        // GDMSESSION
        // GNOME_DESKTOP_SESSION_ID
        // GTK_USE_PORTAL
        // KDE_FULL_SESSION
        // LXQT_SESSION_CONFIG
        // MATE_DESKTOP_SESSION_ID
        // MOZ_DISABLE_WAYLAND_PROXY
        // MOZ_GDK_DISPLAY
        // MOZ_USE_XINPUT2
        // MOZ_X_SYNC
        // MOZ_X11_EGL
        // SNAP
        // SNAP_DESKTOP_RUNTIME
        // SNAP_INSTANCE_NAME
        // SNAP_NAME
        // SNAP_REAL_HOME
        // SYSTEMD_EXEC_PID
        // WAYLAND_DISPLAY
        // WAYLAND_PROXY_LOG
        // XDG_ACTIVATION_TOKEN
        // XDG_CACHE_HOME
        // XDG_CONFIG_DIRS
        // XDG_CONFIG_HOME
        // XDG_CURRENT_DESKTOP
        // XDG_DATA_DIRS
        // XDG_DATA_HOME
        // XDG_MENU_PREFIX
        // XDG_RUNTIME_DIR
        // XDG_SESSION_CLASS
        // XDG_SESSION_DESKTOP
        // XDG_SESSION_TYPE
        } else if (getenv("FLATPAK_ID") || getenv("GDK_BACKEND") || getenv("GDMSESSION") || getenv("GNOME_DESKTOP_SESSION_ID") ||
         getenv("GTK_USE_PORTAL") || getenv("KDE_FULL_SESSION") || getenv("LXQT_SESSION_CONFIG") || getenv("MATE_DESKTOP_SESSION_ID") ||
         getenv("MOZ_DISABLE_WAYLAND_PROXY") || getenv("MOZ_GDK_DISPLAY") || getenv("MOZ_USE_XINPUT2") || getenv("MOZ_X_SYNC") ||
         getenv("MOZ_X11_EGL") || getenv("SNAP") || getenv("SNAP_DESKTOP_RUNTIME") || getenv("SNAP_INSTANCE_NAME") || getenv("SNAP_NAME") ||
         getenv("SNAP_REAL_HOME") || getenv("SYSTEMD_EXEC_PID") || getenv("WAYLAND_DISPLAY") || getenv("WAYLAND_PROXY_LOG") ||
         getenv("XDG_ACTIVATION_TOKEN") || getenv("XDG_CACHE_HOME") || getenv("XDG_CONFIG_DIRS") || getenv("XDG_CONFIG_HOME") ||
         getenv("XDG_CURRENT_DESKTOP") || getenv("XDG_DATA_DIRS") || getenv("XDG_DATA_HOME") || getenv("XDG_MENU_PREFIX") ||
         getenv("XDG_RUNTIME_DIR") || getenv("XDG_SESSION_CLASS") || getenv("XDG_SESSION_DESKTOP") || getenv("XDG_SESSION_TYPE")) {
            PHOENIX_PLATFORM = 'linux';
        // At this point, we should really have our OS, but in case we don't for some reason, check prefs
        // In practice, these shouldn't be used
        } else if (prefExists("apz.android.chrome_fling_physics.friction") || prefExists("apz.android.chrome_fling_physics.inflexion") ||
         prefExists("apz.android.chrome_fling_physics.stop_threshold") || prefExists("network.dns.native_https_timeout_android")) {
            PHOENIX_PLATFORM = 'android';
        } else if (prefExists("browser.low_commit_space_threshold_percent") || prefExists("media.ffmpeg.vaapi.force-surface-zero-copy") ||
         prefExists("widget.gtk.file-manager-show-items-timeout-ms")) {
            PHOENIX_PLATFORM = 'linux';
        } else if (prefExists("network.dns.native_https_timeout_mac_msec") || prefExists("widget.macos.shift-by-menubar-on-fullscreen") ||
         prefExists("widget.macos.automatic.text_substitution_fetch_length")) {
            PHOENIX_PLATFORM = 'osx';
        } else if (prefExists("accessibility.windows.suppress-after-clipboard-copy") || prefExists("accessibility.windows.suppress-for-snap-layout")) {
            PHOENIX_PLATFORM = 'windows';
        }
    } catch (e) {};

    pref("browser.phoenix.platform", PHOENIX_PLATFORM); // [FN]
    pref("browser.phoenix.platform.shouldRunChecks", false); // [FN]
};

const phoenixPlatform = getPref("browser.phoenix.platform");

// Run our platform *type* checks...
/// (ex. this is currently used to distinguish between OS X Silicon and Intel)

const phoenixShouldRunPlatformTypeChecks = getPref("browser.phoenix.platform.type.shouldRunChecks");
const phoenixPlatformTypeCurrentValue = getPref("browser.phoenix.platform.type");

// The platform type checks below will run if:
/// 1. `browser.phoenix.platform` is set to `osx` and `browser.phoenix.platform.type` is not `intel` or `silicon`
/// OR:
/// 2. `browser.phoenix.platform` is NOT set to `osx` and `browser.phoenix.platform.type` is NOT `generic`
/// OR:
/// 3. `browser.phoenix.platform.type.shouldRunChecks` is set to `true`
let phoenixRunPlatformTypeChecks = false;
if (phoenixShouldRunPlatformTypeChecks || (phoenixPlatform == 'osx' && (phoenixPlatformTypeCurrentValue != 'intel' &&
 phoenixPlatformTypeCurrentValue != 'silicon')) || (phoenixPlatform != 'osx' && phoenixPlatformTypeCurrentValue != 'generic')) {
    phoenixRunPlatformTypeChecks = true;
};

if (phoenixRunPlatformTypeChecks) {
    let PHOENIX_PLATFORM_TYPE = 'unknown';
    try {
        if (phoenixPlatform == 'osx') {
            if (getenv("PHOENIX_HOST_PLATFORM") == "osx-intel") {
                PHOENIX_PLATFORM_TYPE = 'intel';
            } else if (getenv("PHOENIX_HOST_PLATFORM") == "osx") {
                PHOENIX_PLATFORM_TYPE = 'silicon';
            };
        } else if (phoenixPlatform == 'android' || phoenixPlatform == 'linux' || phoenixPlatform == 'windows') {
            PHOENIX_PLATFORM_TYPE = 'generic';
        };
    } catch (e) {};

    pref("browser.phoenix.platform.type", PHOENIX_PLATFORM_TYPE); // [FN]
    pref("browser.phoenix.platform.type.shouldRunChecks", false); // [FN]
};

const phoenixPlatformType = getPref("browser.phoenix.platform.type");

// Determine if we're on ESR
defaultPref("browser.phoenix.ESR", false); // [FN]

// If true, this preference will force the ESR checks to run
/// Useful for cases like testing, or if the user ex. migrates profiles across browsers
/// (It is automatically set to `false` after the ESR checks complete)
defaultPref("browser.phoenix.ESR.shouldRunChecks", true); // [FN]

const phoenixShouldRunESRChecks = getPref("browser.phoenix.ESR.shouldRunChecks");
const phoenixESRCurrentValue = getPref("browser.phoenix.ESR");

// The ESR checks below will run if:
/// 1. We're NOT on Android AND:
/// 2. `browser.phoenix.ESR.shouldRunChecks` is set to `true`
let phoenixRunESRChecks = false;
if (phoenixShouldRunESRChecks && phoenixPlatform != 'android') {
    phoenixRunESRChecks = true;
};

if (phoenixRunESRChecks) {
    let PHOENIX_ESR = false;
    let PHOENIX_ESR_SET = false;
    try {
        if (getPref("app.update.channel") == "esr") {
            PHOENIX_ESR = true;
            PHOENIX_ESR_SET = true;
        } else if (getPref("app.update.channel") != "") {
            // Ensure we don't set `PHOENIX_ESR_SET` to `true` if `app.update.channel` isn't set (or is set to an empty string), so
            // that we can keep retrying the check
            PHOENIX_ESR_SET = true;
        };
    } catch (e) {};

    pref("browser.phoenix.ESR", PHOENIX_ESR); // [FN]

    pref("browser.phoenix.ESR.shouldRunChecks", !PHOENIX_ESR_SET); // [FN]
};

const phoenixESR = getPref("browser.phoenix.ESR");

