// This contains preferences specifically tailored for Element.

/* INDEX 

001: UI
002: DEBLOAT
003: UNBREAK

*/

/*** 001 UI ***/

/// Add Element to about:home
defaultPref("browser.newtabpage.pinned", '[{"url":"https://app.element.io/#/home","label":"Element"}]');

defaultPref("browser.phoenix.status.specialized.element", "001");

/*** 002 DEBLOAT ***/

/// Disable Cookie Banner Reduction
// https://support.mozilla.org/kb/cookie-banner-reduction
pref("cookiebanners.bannerClicking.enabled", false);
pref("cookiebanners.cookieInjector.enabled", false);
pref("cookiebanners.service.mode", 0); // [DEFAULT]
pref("cookiebanners.service.mode.privateBrowsing", 0); // [DEFAULT]
pref("cookiebanners.service.enableGlobalRules", false);
pref("cookiebanners.service.enableGlobalRules.subFrames", false);
pref("cookiebanners.ui.desktop.enabled", false); // [DEFAULT]

defaultPref("browser.phoenix.status.specialized.element", "002");

/*** 003 UNBREAK ***/

/// Disable timezone spoofing
defaultPref("privacy.fingerprintingProtection.granularOverrides", "[{\"firstPartyDomain\": \"arcticfoxes.net\", \"overrides\": \"-JSDateTimeUTC\"}, {\"firstPartyDomain\": \"aria.im\", \"overrides\": \"-JSDateTimeUTC\"}, {\"firstPartyDomain\": \"element.io\", \"overrides\": \"-JSDateTimeUTC\"}, {\"firstPartyDomain\": \"mozilla.org\", \"overrides\": \"-JSDateTimeUTC\"}, {\"firstPartyDomain\": \"unredacted.org\", \"overrides\": \"-JSDateTimeUTC\"}]");

/// Re-enable notification prompts, so that it's easier for users to enable if desired
// https://codeberg.org/celenity/Phoenix/issues/77
defaultPref("permissions.default.desktop-notification", 0); // [DEFAULT]

// Re-enable WebAssembly
defaultPref("javascript.options.wasm", true); // [DEFAULT]

defaultPref("browser.phoenix.status.specialized.element", "003");

lockPref("browser.phoenix.status.specialized.element", "successfully applied :D");
