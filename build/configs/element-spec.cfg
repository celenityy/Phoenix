

// Do not apply these settings on profiles you actually plan to browse on or actively use...

// Goal here is to make the profile as light-weight & minimal as possible. Nothing already in the base profile will be covered here.

// We can also enforce various other prefs that we know work fine with Element

// 001 Add Element to about:home

defaultPref("browser.startup.homepage", "about:home");
defaultPref("browser.startup.page", 1);
defaultPref("browser.newtabpage.activity-stream.default.sites", "https://app.element.io/#/home");

lockPref("browser.phoenix.element.001.applied", true);

// 002 Set Firefox to ask for container selection on new tabs

defaultPref("privacy.userContext.newTabContainerOnLeftClick.enabled", true);

lockPref("browser.phoenix.element.002.applied", true);

// 003 Don't open URLs in new tabs

defaultPref("browser.urlbar.openintab", false);

lockPref("browser.phoenix.element.003.applied", true);

// 004 Disable Reader Mode

defaultPref("reader.parse-on-load.enabled", false);

lockPref("browser.phoenix.element.004.applied", true);

// 005 Disable Printing

defaultPref("print.enabled", false);

lockPref("browser.phoenix.element.005.applied", true);

// 006 Disable WebGL

defaultPref("webgl.disabled", true);

lockPref("browser.phoenix.element.006.applied", true);

// 007 Enable WASM
// Unfortunately, Element appears to require it...

defaultPref("javascript.options.wasm", true); // [DEFAULT]

lockPref("browser.phoenix.element.007.applied", true);

// 008 Enable RFP

defaultPref("privacy.resistFingerprinting", true);
defaultPref("privacy.resistFingerprinting.letterboxing", true);

lockPref("browser.phoenix.element.008.applied", true);

// 009 Disable Gecko Media Plugins & OpenH264

defaultPref("media.gmp-gmpopenh264.enabled", false);
defaultPref("media.gmp-gmpopenh264.provider.enabled", false);
defaultPref("media.gmp-gmpopenh264.visible", false);
defaultPref("media.gmp-manager.url.override", "");
defaultPref("media.gmp-manager.url", "");
defaultPref("media.gmp-provider.enabled", false);

lockPref("browser.phoenix.element.009.applied", true);

// 010 Strip referers

defaultPref("network.http.referer.XOriginPolicy", 2);

lockPref("browser.phoenix.element.010.applied", true);

// 011 Remove undesired links & connections

defaultPref("app.feedback.baseURL", "");
defaultPref("app.support.baseURL", "");
defaultPref("browser.geolocation.warning.infoURL", "");

lockPref("browser.phoenix.element.011.applied", true);

// 012 Kill Geolocation

defaultPref("geo.provider.network.url", "");
defaultPref("geo.provider.use_corelocation", false);
defaultPref("geo.provider.use_geoclue", false);

lockPref("browser.phoenix.element.012.applied", true);

// 013 Fully disable browsing history

defaultPref("places.history.enabled", false);

lockPref("browser.phoenix.element.013.applied", true);

// 014 Remove unnecessary URL Bar shortcuts

defaultPref("browser.urlbar.shortcuts.bookmarks", false);
defaultPref("browser.urlbar.shortcuts.history", false);
defaultPref("browser.urlbar.shortcuts.tabs", false);

lockPref("browser.phoenix.element.014.applied", true);

// 015 Never back-up/export bookmarks

defaultPref("browser.bookmarks.autoExportHTML", false);
defaultPref("browser.bookmarks.max_backups", 0);

lockPref("browser.phoenix.element.015.applied", true);

// 016 Never show image placeholders

defaultPref("browser.display.show_image_placeholders", false);

lockPref("browser.phoenix.element.016.applied", true);

// 017 Never show "Other Bookmarks"

defaultPref("browser.toolbars.bookmarks.showOtherBookmarks", false);

lockPref("browser.phoenix.element.017.applied", true);

// 018 Prevent caching previous tabs

defaultPref("browser.sessionstore.max_tabs_undo", 0);
defaultPref("browser.sessionhistory.max_total_viewers", 0);

lockPref("browser.phoenix.element.018.applied", true);

// 019 Disable ETP Heuristics

defaultPref("privacy.antitracking.enableWebcompat", false);
defaultPref("privacy.restrict3rdpartystorage.heuristic.opened_window_after_interaction", false);
defaultPref("privacy.restrict3rdpartystorage.heuristic.recently_visited", false);
defaultPref("privacy.restrict3rdpartystorage.heuristic.redirect", false);
defaultPref("privacy.restrict3rdpartystorage.heuristic.window_open", false);

lockPref("browser.phoenix.element.019.applied", true);

// 020 Disable Cookie Banner Blocking, no point

defaultPref("cookiebanners.bannerClicking.enabled", false);
defaultPref("cookiebanners.cookieInjector.enabled", false);
defaultPref("cookiebanners.service.enableGlobalRules", false);
defaultPref("cookiebanners.service.enableGlobalRules.subFrames", false);
defaultPref("cookiebanners.service.mode", 0);
defaultPref("cookiebanners.service.mode.privateBrowsing", 0);
defaultPref("cookiebanners.ui.desktop.enabled", false);

lockPref("browser.phoenix.element.020.applied", true);

// 021 Misc. URL Bar Suggestions

defaultPref("browser.search.separatePrivateDefault.urlbarResult.enabled", false);
defaultPref("browser.urlbar.clipboard.featureGate", false);
defaultPref("browser.urlbar.maxHistoricalSearchSuggestions", 0);
defaultPref("browser.urlbar.maxRichResults", 0);
defaultPref("browser.urlbar.richSuggestions.featureGate", false);
defaultPref("browser.urlbar.suggest.calculator", false);
defaultPref("browser.urlbar.suggest.clipboard", false);
defaultPref("browser.urlbar.suggest.engines", false);
defaultPref("browser.urlbar.suggest.history", false);
defaultPref("browser.urlbar.suggest.openpage", false);
defaultPref("browser.urlbar.suggest.remotetab", false);
defaultPref("browser.urlbar.unitConversion.enabled", false);
defaultPref("keyword.enabled", false);

lockPref("browser.phoenix.element.021.applied", true);

// 022 No Android Debugging

defaultPref("devtools.remote.adb.extensionID", "");
defaultPref("devtools.remote.adb.extensionURL", "");

lockPref("browser.phoenix.element.022.applied", true);

// 023 Never automatically search for text without prompting

defaultPref("accessibility.typeaheadfind", false);

lockPref("browser.phoenix.element.023.applied", true);

// 024 Disable Quarantined Domains (Unnecessary since Element is only site we use...)

defaultPref("extensions.quarantinedDomains.enabled", false);

lockPref("browser.phoenix.element.024.applied", true);

// 025 Misc. Activity Stream

defaultPref("browser.newtabpage.activity-stream.discoverystream.recentSaves.enabled", false);
defaultPref("browser.newtabpage.activity-stream.section.highlights.includeVisited", false);
defaultPref("browser.newtabpage.activity-stream.showRecentSaves", false);

lockPref("browser.phoenix.element.025.applied", true);

// 026 Disable Animations

defaultPref("toolkit.cosmeticAnimations.enabled", false);
defaultPref("ui.prefersReducedMotion", 1);

lockPref("browser.phoenix.element.026.applied", true);

