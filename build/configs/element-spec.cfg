// This contains various preferences specifically tailored for Element.

// 001 Add Element to about:home

defaultPref("browser.newtabpage.activity-stream.default.sites", "https://app.element.io/#/home");

defaultPref("browser.phoenix.cfg.element.status", "001");

// 002 Enable WASM
// Unfortunately, Element appears to require it...

defaultPref("javascript.options.wasm", true); // [DEFAULT]

defaultPref("browser.phoenix.cfg.element.status", "002");

// 003 Unbreak calling

/// Will need further testing, but I'm not convinced these are necessary...

//defaultPref("media.peerconnection.ice.default_address_only", false); // [DEFAULT]
//defaultPref("media.peerconnection.ice.no_host", false); // [DEFAULT]

//defaultPref("browser.phoenix.cfg.element.status", "003");

// 004 Don't block microphone & camera permission by default...

defaultPref("permissions.default.camera", 0); // [DEFAULT]
defaultPref("permissions.default.microphone", 0); // [DEFAULT]

defaultPref("browser.phoenix.cfg.element.status", "004");

// 005 Allow hijacking keyboard shortcuts

defaultPref("permissions.default.shortcuts", 0); // [DEFAULT]

defaultPref("browser.phoenix.cfg.element.status", "005");

// 006 Disable timezone spoofing for Element...

defaultPref("privacy.fingerprintingProtection.granularOverrides", "[{\"firstPartyDomain\": \"arcticfoxes.net\", \"overrides\": \"-JSDateTimeUTC\"}, {\"firstPartyDomain\": \"aria.im\", \"overrides\": \"-JSDateTimeUTC\"}, {\"firstPartyDomain\": \"element.io\", \"overrides\": \"-JSDateTimeUTC\"}, {\"firstPartyDomain\": \"mozilla.org\", \"overrides\": \"-JSDateTimeUTC\"}, {\"firstPartyDomain\": \"unredacted.org\", \"overrides\": \"-JSDateTimeUTC\"}]");

defaultPref("browser.phoenix.cfg.element.status", "005");

lockPref("browser.phoenix.cfg.element.status", "successfully applied :D");
