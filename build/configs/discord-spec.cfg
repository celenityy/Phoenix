

// Unfortunately I have to use Discord from time to time, so I put it in a separate Firefox profile exclusively used for it.

// This contains various preferences specifically tailored for Discord.

// 001 Add Discord to about:home

defaultPref("browser.newtabpage.activity-stream.default.sites", "https://discord.com/channels/@me");

lockPref("browser.phoenix.cfg.discord.status", "001");

