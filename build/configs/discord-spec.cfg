// This contains preferences specifically tailored for Discord.

/*** 001 UI ***/

/// Add Discord to about:home
defaultPref("browser.newtabpage.pinned", "[{"url":"https://discord.com/channels/@me","label":"Discord"}]");

defaultPref("browser.phoenix.status.specialized.discord", "001");

/*** 002 UNBREAK ***/

/// Disable timezone spoofing
defaultPref("privacy.fingerprintingProtection.granularOverrides", "[{\"firstPartyDomain\": \"discord.com\", \"overrides\": \"-JSDateTimeUTC\"}]");

/// Unbreak calling
defaultPref("media.peerconnection.ice.default_address_only", false); // [DEFAULT]
defaultPref("media.peerconnection.ice.no_host", false); // [DEFAULT]
defaultPref("media.peerconnection.ice.relay_only", false); // [DEFAULT]

defaultPref("browser.phoenix.status.specialized.discord", "002");

lockPref("browser.phoenix.status.specialized.discord", "successfully applied :D");
