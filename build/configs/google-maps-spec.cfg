// This contains preferences specifically tailored for Google Maps.

/*** 001 UI ***/

/// Add Google Maps to about:home
defaultPref("browser.newtabpage.pinned", '[{"url":"https://www.google.com/maps","label":"Google Maps"}]');

defaultPref("browser.phoenix.status.specialized.google-maps", "001");

/*** 002 PRIVACY ***/

/// Sanitize data on exit
defaultPref("privacy.clearOnShutdown.cookies", true);
defaultPref("privacy.clearOnShutdown.offlineApps", true);
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", true);

defaultPref("browser.phoenix.status.specialized.google-maps", "002");

/*** 003 SECURITY ***/

/// Disable SVG
// https://cve.mitre.org/cgi-bin/cvekey.cgi?keyword=firefox+svg
defaultPref("svg.disabled", true);

/// Disable WebRTC
// https://cve.mitre.org/cgi-bin/cvekey.cgi?keyword=webrtc
// https://x.com/GrapheneOS/status/1728921946396725618
defaultPref("media.peerconnection.enabled", false);

defaultPref("browser.phoenix.status.specialized.google-maps", "003");

/*** 004 UNBREAK ***/

/// Re-enable geolocation
defaultPref("geo.provider.network.url", "https://api.beacondb.net/v1/geolocate");
defaultPref("geo.provider.use_corelocation", true); // [DEFAULT]
defaultPref("geo.provider.use_geoclue", true); // [DEFAULT]
defaultPref("permissions.default.geo", 0); // [DEFAULT]

/// Re-enable Mozilla's remote FPP overrides to fix display issues with Google Maps
defaultPref("privacy.fingerprintingProtection.remoteOverrides.enabled", true); // [DEFAULT]

defaultPref("browser.phoenix.status.specialized.google-maps", "004");

lockPref("browser.phoenix.status.specialized.google-maps", "successfully applied :D");
