defaultPref("browser.contentblocking.report.endpoint_url", "");
defaultPref("browser.contentblocking.report.lockwise.enabled", false);
defaultPref("browser.contentblocking.report.lockwise.how_it_works.url", "");
defaultPref("browser.contentblocking.report.mobile-android.url", "");
defaultPref("browser.contentblocking.report.mobile-ios.url", "");
