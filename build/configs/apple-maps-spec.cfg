// This contains preferences specifically tailored for Apple Maps.

/* INDEX 

001: UI
002: DEBLOAT
003: PRIVACY
004: SECURITY
005: UNBREAK

*/

/*** 001 UI ***/

/// Add Apple Maps to about:home
defaultPref("browser.newtabpage.pinned", '[{"url":"https://beta.maps.apple.com/","label":"Apple Maps"}]');

/// Hide Firefox Multi-Account Containers
defaultPref("browser.uiCustomization.state", "{\"placements\":{\"widget-overflow-fixed-list\":[],\"unified-extensions-area\":[\"_testpilot-containers-browser-action\"],\"nav-bar\":[\"back-button\",\"forward-button\",\"vertical-spacer\",\"stop-reload-button\",\"urlbar-container\",\"fxa-toolbar-menu-button\",\"reset-pbm-toolbar-button\",\"developer-button\",\"ublock0_raymondhill_net-browser-action\",\"downloads-button\",\"unified-extensions-button\"],\"toolbar-menubar\":[\"menubar-items\"],\"TabsToolbar\":[\"tabbrowser-tabs\",\"new-tab-button\"],\"vertical-tabs\":[],\"PersonalToolbar\":[\"personal-bookmarks\"]},\"seen\":[\"reset-pbm-toolbar-button\",\"developer-button\",\"_testpilot-containers-browser-action\",\"ublock0_raymondhill_net-browser-action\"],\"dirtyAreaCache\":[\"nav-bar\",\"vertical-tabs\",\"PersonalToolbar\",\"unified-extensions-area\",\"TabsToolbar\",\"toolbar-menubar\"],\"currentVersion\":21,\"newElementCount\":4}");

/// Prevent Firefox from asking to select a container on new tabs
defaultPref("privacy.userContext.newTabContainerOnLeftClick.enabled", false);

defaultPref("browser.phoenix.status.specialized.apple-maps", "001");

/*** 002 DEBLOAT ***/

/// Disable Containers
// https://support.mozilla.org/kb/how-use-firefox-containers
defaultPref("privacy.userContext.enabled", false);
defaultPref("privacy.userContext.ui.enabled", false);

/// Disable Cookie Banner Reduction
// https://support.mozilla.org/kb/cookie-banner-reduction
defaultPref("cookiebanners.bannerClicking.enabled", false);
defaultPref("cookiebanners.cookieInjector.enabled", false);
defaultPref("cookiebanners.service.mode", 0); // [DEFAULT]
defaultPref("cookiebanners.service.mode.privateBrowsing", 0); // [DEFAULT]
defaultPref("cookiebanners.service.enableGlobalRules", false);
defaultPref("cookiebanners.service.enableGlobalRules.subFrames", false);
defaultPref("cookiebanners.ui.desktop.enabled", false); // [DEFAULT]

defaultPref("browser.phoenix.status.specialized.apple-maps", "002");

/*** 003 PRIVACY ***/

/// Sanitize data on exit
defaultPref("privacy.clearOnShutdown.cookies", true);
defaultPref("privacy.clearOnShutdown.offlineApps", true);
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", true);

defaultPref("browser.phoenix.status.specialized.apple-maps", "003");

/*** 004 SECURITY ***/

/// Disable WebRTC
// https://cve.mitre.org/cgi-bin/cvekey.cgi?keyword=webrtc
// https://x.com/GrapheneOS/status/1728921946396725618
defaultPref("media.peerconnection.enabled", false);

defaultPref("browser.phoenix.status.specialized.apple-maps", "004");

/*** 005 UNBREAK ***/

/// Re-enable geolocation
defaultPref("geo.provider.network.url", "https://api.beacondb.net/v1/geolocate");
defaultPref("geo.provider.use_corelocation", true); // [DEFAULT]
defaultPref("geo.provider.use_geoclue", true); // [DEFAULT]
defaultPref("permissions.default.geo", 0); // [DEFAULT]

defaultPref("browser.phoenix.status.specialized.apple-maps", "005");

lockPref("browser.phoenix.status.specialized.apple-maps", "successfully applied :D");
