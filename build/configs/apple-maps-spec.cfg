// This contains preferences specifically tailored for Apple Maps.

/*** 001 UI ***/

/// Add Apple Maps to about:home
defaultPref("browser.newtabpage.pinned", "[{"url":"https://beta.maps.apple.com/","label":"Apple Maps"}]");

/// Load Apple Maps on browser launch
defaultPref("browser.startup.homepage", "https://beta.maps.apple.com/");

/// Stop Firefox from always asking for container selection on new tabs
defaultPref("privacy.userContext.newTabContainerOnLeftClick.enabled", false);

defaultPref("browser.phoenix.status.specialized.apple-maps", "001");

/*** 002 PRIVACY ***/

/// Sanitize data on exit
defaultPref("privacy.clearOnShutdown.cookies", true);
defaultPref("privacy.clearOnShutdown.offlineApps", true);
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", true);

defaultPref("browser.phoenix.status.specialized.apple-maps", "002");

/*** 003 SECURITY ***/

/// Disable WebRTC for attack surface reduction
// https://x.com/GrapheneOS/status/1728921946396725618
defaultPref("media.peerconnection.enabled", false);

defaultPref("browser.phoenix.status.specialized.apple-maps", "003");

/*** 004 UNBREAK ***/

/// Re-enable geolocation
defaultPref("geo.provider.network.url", "https://api.beacondb.net/v1/geolocate");
defaultPref("geo.provider.use_corelocation", true); // [DEFAULT]
defaultPref("geo.provider.use_geoclue", true); // [DEFAULT]
defaultPref("permissions.default.geo", 0); // [DEFAULT]

/// Re-enable WebGL
defaultPref("webgl.disabled", false); // [DEFAULT]

/// Stop spoofing WebGL render capability
defaultPref("privacy.fingerprintingProtection.granularOverrides", "[{\"firstPartyDomain\": \"apple.com\", \"overrides\": \"-WebGLRenderCapability\"}]");

defaultPref("browser.phoenix.status.specialized.apple-maps", "004");

lockPref("browser.phoenix.status.specialized.apple-maps", "successfully applied :D");
