// This contains various preferences specifically tailored for YouTube.

// 001 Add YouTube to about:home

defaultPref("browser.newtabpage.activity-stream.default.sites", "https://www.youtube.com/");

defaultPref("browser.phoenix.cfg.youtube.status", "001");

// 002 Clear cookies & site data on exit...

defaultPref("privacy.clearOnShutdown.cookies", true);
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", true);

defaultPref("browser.phoenix.cfg.youtube.status", "002");

// 003 Disable WebRTC for attack surface reduction
// https://x.com/GrapheneOS/status/1728921946396725618

defaultPref("media.peerconnection.enabled", false);

defaultPref("browser.phoenix.cfg.youtube.status", "003");

// 004 Disable Trusted Types to unbreak Picture-in-Picture...

defaultPref("dom.security.trusted_types.enabled", false); // [DEFAULT]

defaultPref("browser.phoenix.cfg.youtube.status", "004");

lockPref("browser.phoenix.cfg.youtube.status", "successfully applied :D");
