// This contains preferences specifically tailored for YouTube.

/*** 001 UI ***/

/// Add YouTube to about:home
defaultPref("browser.newtabpage.pinned", '[{"url":"https://www.youtube.com/","label":"YouTube"}]');

defaultPref("browser.phoenix.status.specialized.youtube", "001");

/*** 002 PRIVACY ***/

/// Sanitize data on exit
defaultPref("privacy.clearOnShutdown.cookies", true);
defaultPref("privacy.clearOnShutdown.offlineApps", true);
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", true);

defaultPref("browser.phoenix.status.specialized.youtube", "002");

/*** 003 SECURITY ***/

/// Disable WebRTC
// https://cve.mitre.org/cgi-bin/cvekey.cgi?keyword=webrtc
// https://x.com/GrapheneOS/status/1728921946396725618
defaultPref("media.peerconnection.enabled", false);

defaultPref("browser.phoenix.status.specialized.youtube", "003");

/*** 004 UNBREAK ***/

/// Temporarily disable Trusted Types to unbreak Picture-in-Picture...
// https://bugzilla.mozilla.org/show_bug.cgi?id=1947672
defaultPref("dom.security.trusted_types.enabled", false); // [DEFAULT]

defaultPref("browser.phoenix.status.specialized.youtube", "004");

lockPref("browser.phoenix.status.specialized.youtube", "successfully applied :D");
