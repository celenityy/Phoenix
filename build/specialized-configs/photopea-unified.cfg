// This contains preferences specifically tailored for Photopea.

/// Add custom branding at `about:support`
lockPref("app.support.vendor", "Phoenix - Photopea SC: 2025.09.07.1"); // [HIDDEN]

/// Add custom branding under `Firefox Updates` at `about:preferences#general`
// This will unfortunately only display if the version of Firefox you're using is repackaged (ex. Flatpaks/Linux distros)
lockPref("distribution.about", "Phoenix - Photopea SC for Mozilla Firefox: 2025.09.07.1 💜"); // [HIDDEN]

/* INDEX 

001: DEBLOAT
002: PRIVACY + SECURITY
003: PRIVACY
004: UNBREAK

*/

/// Load Photopea...
defaultPref("browser.startup.homepage", "https://www.photopea.com/");

/*** 001 DEBLOAT ***/

/// Disable Containers
// https://support.mozilla.org/kb/how-use-firefox-containers
defaultPref("privacy.userContext.enabled", false);
defaultPref("privacy.userContext.ui.enabled", false);

/// Disable Cookie Banner Reduction
// https://support.mozilla.org/kb/cookie-banner-reduction
defaultPref("cookiebanners.bannerClicking.enabled", false);
defaultPref("cookiebanners.cookieInjector.enabled", false);
defaultPref("cookiebanners.listService.testSkipRemoteSettings", true);
defaultPref("cookiebanners.service.mode", 0); // [DEFAULT]
defaultPref("cookiebanners.service.mode.privateBrowsing", 0); // [DEFAULT]
defaultPref("cookiebanners.service.enableGlobalRules", false);
defaultPref("cookiebanners.service.enableGlobalRules.subFrames", false);
defaultPref("cookiebanners.ui.desktop.enabled", false); // [DEFAULT]

defaultPref("browser.phoenix.status.specialized.photopea", "001");

/*** 002 PRIVACY + SECURITY ***/

/// Block Private Network Access requests unconditionally
defaultPref("network.lna.blocking", true);

defaultPref("browser.phoenix.status.specialized.photopea", "002");

/*** 003 PRIVACY ***/

/// Sanitize data on exit
defaultPref("privacy.clearOnShutdown.cookies", true);
defaultPref("privacy.clearOnShutdown.offlineApps", true);
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", true);

defaultPref("browser.phoenix.status.specialized.photopea", "003");

/*** 004 UNBREAK ***/

/// Re-enable WebAssembly
defaultPref("javascript.options.wasm", true); // [DEFAULT]

/// Re-enable WebGL
defaultPref("webgl.disabled", false); // [DEFAULT]

defaultPref("browser.phoenix.status.specialized.photopea", "004");

lockPref("browser.phoenix.status.specialized.photopea", "successfully applied :D");
