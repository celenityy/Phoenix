lockPref("browser.phoenix.discord.026.applied", true);

// 027 Disable Quarantined Domains (Unnecessary since Discord is only site we use...)

defaultPref("extensions.quarantinedDomains.enabled", false);

lockPref("browser.phoenix.discord.027.applied", true);

// 028 Misc. Activity Stream

lockPref("browser.newtabpage.activity-stream.discoverystream.recentSaves.enabled", false);
