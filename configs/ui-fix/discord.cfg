// 025 No Android Debugging

lockPref("devtools.remote.adb.extensionID", "");
lockPref("devtools.remote.adb.extensionURL", "");

lockPref("browser.phoenix.discord.025.applied", true);

// 026 Never automatically search for text without prompting

