// This contains various preferences specifically tailored for X/Twitter.

// 001 Add Twitter to about:home

defaultPref("browser.newtabpage.activity-stream.default.sites", "https://x.com/home");

defaultPref("browser.phoenix.cfg.twitter.status", "001");

// 002 Only Strip some referers
// Required for images appear in DMs...

defaultPref("network.http.referer.XOriginPolicy", 1);

defaultPref("browser.phoenix.cfg.twitter.status", "002");

// 003 Unbreak speaking in X/Twitter Spaces
/// You're welcome to comment these out if you don't have any plans to speak in X/Twitter spaces...
/// Even listening appears to work fine without these, ONLY required for speaking

defaultPref("media.peerconnection.enabled", true); // [DEFAULT]
defaultPref("media.peerconnection.ice.no_host", false); // [DEFAULT]
defaultPref("media.peerconnection.ice.relay_only", false); // [DEFAULT]

defaultPref("browser.phoenix.cfg.twitter.status", "003");

// 004 Don't block microphone permission by default... (X/Twitter Spaces)

defaultPref("permissions.default.microphone", 0); // [DEFAULT]

defaultPref("browser.phoenix.cfg.twitter.status", "004");

lockPref("browser.phoenix.cfg.twitter.status", "successfully applied :D");
