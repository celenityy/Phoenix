    defaultPref("network.cookie.noPersistentStorage", true); // [DEFENSE IN DEPTH] Prevent storing cookies persistently https://bugzilla.mozilla.org/show_bug.cgi?id=1675829
};
if (phoenixSpecActive != "element") {
    // For specialized configs like this, I would usually just clear cookies/site data by default and set an exception for the desired service/website
    // But, there is an upstream bug that causes cookies partitioning to be disabled for exempt sites
    // This isn't ideal on the other specialized configs, but not really an issue there - since the *only* site being allowed is the one for the desired service, and we don't expect the user to allow additional sites
    // But, since there are a significant amount of Element instances, we don't really know which one the user is using, and simply exempting all of them would disable partitioning for *all* of those domains...
    // So, I think we need to find a better solution here - until we do, just keep as is and don't sanitize the data on exit there
    defaultPref("privacy.clearOnShutdown.cookies", true); // [DEFAULT]
    defaultPref("privacy.clearOnShutdown.offlineApps", true);
    defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", true); // [DEFAULT]
};

