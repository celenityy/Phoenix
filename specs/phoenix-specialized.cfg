// This is for shared preferences across Phoenix's 'specialized' configs...

// Do not apply these settings on profiles you actually plan to browse on or actively use...

// Goal here is to make these profile as light-weight and minimal as possible.

phoenixPlatform = getPref("browser.phoenix.platform");
phoenixSpecActive = getPref("browser.phoenix.specConfig");
phoenixVersion = getPref("browser.phoenix.version");

if (phoenixPlatform == "osx") {
    phoenixOSX = getPref("browser.phoenix.osx");
} else {
    phoenixOSX = 'not-osx';
};

/// Determine Phoenix's installation directory
if (phoenixPlatform == "linux") {
    phoenixPath = "/etc/firefox/phoenix";
} else if (phoenixPlatform == "osx") {
    if (phoenixOSX == "intel") {
        phoenixPath = "/usr/local/opt/phoenix-intel";
    } else {
        phoenixPath = "/opt/homebrew/opt/phoenix-osx";
    };
} else if (phoenixPlatform == "windows") {
    phoenixPath = "/C:/phoenix";
} else {
    phoenixPath = "/app/etc/firefox/phoenix";
};

/// Set-up our specialized config we should use
// Phoenix currently offers specialized configs for:
//  Apple Maps
//  Discord
//  Element
//  Google Maps
//  Photopea
//  Twitter
//  YouTube
//  YouTube Music
if (phoenixSpecActive == "apple-maps") {
    phoenixSpecName = "Apple Maps";
    defaultPref("browser.startup.homepage", "https://maps.apple.com/");
} else if (phoenixSpecActive == "discord") {
    phoenixSpecName = "Discord";
    defaultPref("browser.startup.homepage", "https://discord.com/channels/@me");
} else if (phoenixSpecActive == "element") {
    phoenixSpecName = "Element";
    defaultPref("browser.startup.homepage", "https://app.element.io/#/home");
} else if (phoenixSpecActive == "google-maps") {
    phoenixSpecName = "Google Maps";
    defaultPref("browser.startup.homepage", "https://www.google.com/maps");
} else if (phoenixSpecActive == "photopea") {
    phoenixSpecName = "Photopea";
    defaultPref("browser.startup.homepage", "https://www.photopea.com/");
} else if (phoenixSpecActive == "twitter") {
    phoenixSpecName = "Twitter";
    defaultPref("browser.startup.homepage", "https://x.com/home");
} else if (phoenixSpecActive == "youtube") {
    phoenixSpecName = "YouTube";
    defaultPref("browser.startup.homepage", "https://www.youtube.com/");
} else if (phoenixSpecActive == "youtube-music ") {
    phoenixSpecName = "YouTube Music";
    defaultPref("browser.startup.homepage", "https://music.youtube.com/");
} else {
    phoenixSpecName = "Unknown";
    defaultPref("browser.startup.homepage", "chrome://browser/content/blanktab.html");
};

/// Add custom branding at `about:support`
defaultPref("app.support.vendor", `Phoenix - ${phoenixSpecName} SC: ${phoenixVersion}`); // [HIDDEN]

/// Add custom branding under `Firefox Updates` at `about:preferences#general`
// This will unfortunately only display if the version of Firefox you're using is repackaged (ex. Flatpaks/Linux distros)
lockPref("distribution.about", `Phoenix - ${phoenixSpecName} SC: ${phoenixVersion} 💜`); // [HIDDEN]

