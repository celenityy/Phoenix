};

/// Set default permissions for specialized configs
if (phoenixSpecActive == "apple-maps") {
    /// By default, allow Apple Maps to:
    // - Prompt to access geolocation
    defaultPref("permissions.manager.defaultsUrl", `file://${phoenixPath}/resources/specs/apple-maps/permissions`);
} else if (phoenixSpecActive == "discord") {
    /// By default, allow Discord to:
    // - Prompt to access camera
    // - Prompt to access microphone
    // - Prompt to screenshare
    // - Prompt to send notifications
    // - Save cookies/site data
    defaultPref("permissions.manager.defaultsUrl", `file://${phoenixPath}/resources/specs/discord/permissions`);
} else if (phoenixSpecActive == "element") {
    /// By default, allow Element to:
    // - Prompt to access camera
    // - Prompt to access microphone
    // - Prompt to screenshare
    // - Prompt to send notifications
    defaultPref("permissions.manager.defaultsUrl", `file://${phoenixPath}/resources/specs/element/permissions`);
} else if (phoenixSpecActive == "google-maps") {
    /// By default, allow Google Maps to:
    // - Prompt to access geolocation
    defaultPref("permissions.manager.defaultsUrl", `file://${phoenixPath}/resources/specs/google-maps/permissions`);
} else if (phoenixSpecActive == "twitter") {
    /// By default, allow Twitter to:
    // - Prompt to access microphone
