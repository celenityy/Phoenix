default:
  cache: []
  retry:
    max: 2
    when:
      - data_integrity_failure
      - job_execution_timeout
      - runner_configuration_error
      - runner_external_dependency_failure
      - runner_interrupted
      - runner_system_failure
      - scheduler_failure
      - stale_schedule
      - stuck_or_timeout_failure
      - unknown_failure

variables: &common_variables
  ARTIFACT_COMPRESSION_LEVEL: 'slowest'
  CACHE_COMPRESSION_LEVEL: 'slowest'
  FF_USE_FASTZIP: '1'
  PHOENIX_CI: 1
  PHOENIX_CI_TYPE: 'gitlab'
  PRODUCTION_BRANCH: 'pages'
  TRANSFER_METER_FREQUENCY: '2s'

stages:
  - build_phoenix
  - release_phoenix

build:
  image: fedora:43
  stage: build_phoenix
  tags:
    - saas-linux-2xlarge-amd64
  variables:
    <<: *common_variables
  script:
    - set -euo pipefail
    - /bin/bash scripts/ci-build.sh
  artifacts:
    untracked: false
    when: always
    access: all
    expire_in: "30 days"
    paths:
      - $CI_PROJECT_DIR/artifacts/logs/**/*
  rules:
    - if: $CI_PROJECT_NAMESPACE != 'celenityy'
      when: never
    - changes:
        - scripts/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG
      when: never

publish-release:
  image: fedora:43
  stage: release_phoenix
  interruptible: true
  needs:
    - job: 'build'
      optional: false
  rules:
    - if: $CI_PROJECT_NAMESPACE != 'celenityy'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $PRODUCTION_BRANCH && $CI_COMMIT_MESSAGE =~ /\[skip-release\]/
      when: never
    - if: $CI_COMMIT_BRANCH == $PRODUCTION_BRANCH
  tags:
    - saas-linux-2xlarge-amd64
  variables:
    <<: *common_variables
  script:
    - set -euo pipefail
    - /bin/bash scripts/ci-publish-release.sh
